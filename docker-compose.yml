services:
  atlas:
    build: .
    ports:
      - "8000:8000"
    env_file: .env                  # set ONE provider: ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY ...
    environment:
      ATLAS_DATA_DIR: /data
      # The web UI answers approval prompts itself; never block on a terminal.
      ATLAS_APPROVAL_MODE: ask
    volumes:
      - atlas-data:/data            # knowledge base, memories, sessions, traces
    restart: unless-stopped

  # One-shot job: index the sample knowledge base into the shared volume.
  #   docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["tools"]
    environment:
      ATLAS_DATA_DIR: /data
    volumes:
      - atlas-data:/data
    command: ["atlas", "ingest", "examples/knowledge"]

  # Fully local stack (no API keys). In .env set:
  #   ATLAS_PROVIDER=ollama
  #   ATLAS_BASE_URL=http://ollama:11434/v1
  #   ATLAS_MODEL=qwen3:8b
  # then:  docker compose --profile local up -d
  #        docker compose exec ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  atlas-data:
  ollama-models:
