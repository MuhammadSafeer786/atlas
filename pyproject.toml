[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agents"
version = "1.0.0"
description = "Atlas - a provider-agnostic multi-agent research platform (Claude, OpenAI, Gemini, local LLMs): tool use, MCP, hybrid RAG, memory, planning, reflection, human-in-the-loop, guardrails, tracing and evals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic[mcp]>=1.13",
    "openai>=3.31",        # OpenAI + any OpenAI-compatible server (Ollama, LM Studio, vLLM, ...)
    "google-genai>=2.30",  # Gemini
    "httpx>=0.27",         # fetch_url / web_search tools
    "mcp>=2.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Dense embeddings for hybrid RAG (BM25 works without this).
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # typer.Option(...) defaults are the idiomatic Typer pattern

[tool.ruff.lint.per-file-ignores]
"atlas/agents/prompts.py" = ["E501"]  # prompts are prose; wrapping would change the text
